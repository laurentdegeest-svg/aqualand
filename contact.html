<body data-page="contact" data-dark="0">
<main>

<section class="portal-sec">
  <div class="container form-wrap">
    <div class="center" style="margin-bottom:34px"><span class="eyebrow">Gratuit et sans engagement</span><h1 class="contact-h">Un expert vient chez vous.</h1><p class="lead">Laissez-nous vos coordonnées : nous vous appelons pour fixer ensemble la date de la visite.</p></div>
    <div class="tabs" role="tablist"><button data-tab="rdv" class="active">Rendez-vous à domicile</button><button data-tab="devis">Simple demande de devis</button></div>

    <form data-lead="Rendez-vous" data-pane="rdv" class="lead-form simple" novalidate>
      <div class="field"><label>Nom et prénom</label><input name="nom" required autocomplete="name"></div>
      <div class="grid2">
        <div class="field"><label>Téléphone</label><input name="telephone" type="tel" required autocomplete="tel"></div>
        <div class="field"><label>E-mail</label><input name="email" type="email" required autocomplete="email"></div>
      </div>
      <div class="field"><label>Adresse</label><input name="adresse" required autocomplete="street-address" placeholder="Rue et numéro"></div>
      <div class="grid2">
        <div class="field"><label>Code postal</label><input name="code_postal" required inputmode="numeric" maxlength="4" pattern="[0-9]{4}"></div>
        <div class="field"><label>Localité</label><input name="localite" autocomplete="address-level2"></div>
      </div>
      <div class="field"><label>Votre projet</label>
        <div class="choices one-row">
          <label class="choice"><input type="radio" name="projet" value="Particulier · première installation" checked><span>Particulier</span></label>
          <label class="choice"><input type="radio" name="projet" value="Remplacement d'un ancien adoucisseur"><span>Remplacement</span></label>
          <label class="choice"><input type="radio" name="projet" value="Professionnel"><span>Professionnel</span></label>
        </div></div>
      <label class="consent"><input type="checkbox" name="consentement" value="Oui" required><span>J'accepte qu'Aqualand utilise ces informations pour me répondre. Elles ne sont jamais revendues.</span></label><input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <button class="btn btn-glow btn-block" type="submit">Demander mon rendez-vous</button><p class="form-msg"></p>
      <p class="muted small center">La date est convenue ensemble par téléphone.</p>
    </form>

    <form data-lead="Devis" data-pane="devis" class="lead-form simple" novalidate hidden>
      <div class="field"><label>Nom et prénom</label><input name="nom" required autocomplete="name"></div>
      <div class="grid2">
        <div class="field"><label>Téléphone</label><input name="telephone" type="tel" required autocomplete="tel"></div>
        <div class="field"><label>E-mail</label><input name="email" type="email" required autocomplete="email"></div>
      </div>
      <div class="field"><label>Code postal</label><input name="code_postal" required inputmode="numeric" maxlength="4" pattern="[0-9]{4}"></div>
      <div class="field"><label>Votre message (facultatif)</label><textarea name="message" rows="3" placeholder="Nombre de personnes, emplacement, questions…"></textarea></div>
      <label class="consent"><input type="checkbox" name="consentement" value="Oui" required><span>J'accepte qu'Aqualand utilise ces informations pour me répondre. Elles ne sont jamais revendues.</span></label><input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <button class="btn btn-glow btn-block" type="submit">Envoyer ma demande</button><p class="form-msg"></p>
    </form>

    <div class="contact-alt"><span>Vous préférez le faire vous-même ?</span><button class="btn btn-light" data-open-diag-direct>Diagnostic en ligne · −15 %</button></div>
  </div>
</section>

</main>
